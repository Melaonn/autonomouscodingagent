services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sdlc
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-only}"
      POSTGRES_DB: sdlc
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sdlc"], interval: 5s, timeout: 3s, retries: 20 }
  server:
    build: { context: ., dockerfile: docker/app.Dockerfile }
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4310
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4310}
      DATABASE_URL: postgres://sdlc:${POSTGRES_PASSWORD:-local-only}@postgres/sdlc
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      RUNNER_URL: http://runner:4311
      RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN is required}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_ALLOWED_USERS: ${GITHUB_ALLOWED_USERS:-}
      GITHUB_ADMIN_USERS: ${GITHUB_ADMIN_USERS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on: { postgres: { condition: service_healthy }, runner: { condition: service_started } }
    ports: ["4310:4310"]
  runner:
    build: { context: ., dockerfile: docker/app.Dockerfile }
    command: ["node", "apps/server/dist/runner-main.js"]
    environment:
      RUNNER_HOST: 0.0.0.0
      RUNNER_PORT: 4311
      RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN is required}
      WORKER_IMAGE: sdlc-worker:local
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CODEX_AUTH_DIR: ${CODEX_AUTH_MOUNT:-sdlc-codex-auth}
      CLAUDE_AUTH_DIR: ${CLAUDE_AUTH_MOUNT:-sdlc-claude-auth}
    user: "0"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    depends_on: { worker-image: { condition: service_completed_successfully } }
  worker-image:
    image: sdlc-worker:local
    build: { context: ., dockerfile: docker/worker/Dockerfile }
    command: ["true"]
volumes:
  postgres-data: {}
  # The runner creates child containers through the host Docker daemon, so these
  # two names must not receive a Compose project prefix.
  sdlc-codex-auth: { name: sdlc-codex-auth }
  sdlc-claude-auth: { name: sdlc-claude-auth }
